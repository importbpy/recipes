services:
  database:
    container_name: recipes_database
    image: mysql:8.0.33
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recipes}
      MYSQL_USER: ${MYSQL_USER:-recipes}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "${MYSQL_PORT:-127.0.0.1:4306}:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  php-fpm:
    container_name: recipes_php
    restart: unless-stopped
    build:
      context: php
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:-efdab0e6fd66a1219859aee8d6103167}
      DATABASE_URL: mysql://${MYSQL_USER:-recipes}:${MYSQL_PASSWORD:-password}@database:3306/${MYSQL_DATABASE:-recipes}?serverVersion=8.0
      ENABLE_REGISTRATIONS: ${ENABLE_REGISTRATIONS:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ..:/var/www/recipes

  nginx:
    container_name: recipes_nginx
    restart: unless-stopped
    image: nginx:stable-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ..:/var/www/recipes
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm

  backup:
    container_name: recipes_backup
    restart: unless-stopped
    build:
      context: backup
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      MYSQL_HOST: database
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recipes}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
    volumes:
      - ./backups:/backups
      - ../public/images:/images

  adminer:
    container_name: recipes_adminer
    restart: unless-stopped
    image: adminer
    profiles:
      - dev
    ports:
      - "${ADMINER_PORT:-127.0.0.1:9090}:8080"